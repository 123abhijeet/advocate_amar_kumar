
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Kumar | Advocate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px;
            background: #f3f3f3;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card-image {
            width: 100%;
            height: auto;
            display: block;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
        }

        .download-area {
            text-align: center;
            margin: 22px 0;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 25px;
            background: #171717;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #444;
        }

        .download-btn svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- English Visiting Card -->
    <img
        src="images/advocate_amar_kumar.jpeg"
        alt="Amar Kumar Advocate Visiting Card"
        class="card-image"
    >

    <!-- Download Button -->
    <div class="download-area">

        <a
            href="images/advocate_amar_kumar.jpeg"
            download="Amar-Kumar-Advocate.jpg"
            class="download-btn"
        >
            <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
        </a>

    </div>

</div>

</body>
</html>
